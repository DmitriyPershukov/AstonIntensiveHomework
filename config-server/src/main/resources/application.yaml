spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_URL}
          default-label: main
          clone-on-start: true
eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:${EUREKA_SERVER_PORT}/eureka/
server:
  port: ${CONFIG_SERVER_PORT}

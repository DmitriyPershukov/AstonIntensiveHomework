spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-route
              uri: http://user-service:${USER_SERVICE_PORT}
              predicates:
                - Path=/users,/users/**
            - id: notification-route
              uri: http://notification-service:${NOTIFICATION_SERVICE_PORT}
              predicates:
                - Path=/notification,/notification/**
eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:${EUREKA_SERVER_PORT}/eureka/
server:
  port: ${API_GATEWAY_PORT}
